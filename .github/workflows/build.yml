# Build the Fabric project and validate/package the standalone web editor.
name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: microsoft
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabric-artifacts
          path: build/libs/

  web-editor:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: lint and test web editor
        run: npm run test:web
      - name: package standalone editor
        run: |
          mkdir -p build/web-editor
          cp web/korg-editor/index.html web/korg-editor/script.js web/korg-editor/editor-core.js web/korg-editor/styles.css web/korg-editor/TESTING.md build/web-editor/
          cd build
          zip -r korg-editor.zip web-editor
      - name: capture web editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: korg-editor
          path: build/korg-editor.zip
          if-no-files-found: error
